<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="position.css">
</head>
<body>
    <!--     ** position property is used to specify tje position of elements on a web page
    position static is the default position of elements on a web page  
    position relative works on the basis of parent or container element 
    position absolute works on the basis of nearest positioned ancestor element
    position fixed is used to fix an element in a specific position on the web page, regardless -->
<div class="container">
    <div class=" position relative">relative</div>
    <div class=" position absolute">absolute</div>
    <div class="position fixed">fixed</div>
    
<div class="spacer"></div>

</div>
    
</body>
</html>
