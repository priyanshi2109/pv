    <!-- display property is used to specify the display behavior of an element. It determines how an element is displayed on the web page and how it interacts with other elements. 
    The display property can take several values, including:

    block elemenrs are elements in which the content is displayed on a new line and takes up the full width of the container. Examples of block elements include <div>, <p>, and <h1>.
    inline elements are elements in which the content is displayed on the same line as the surrounding content and only takes up as much width as necessary.
     Examples of inline elements include <span>, <a>, and <strong>.
   
        inline-block elements are elements that are similar to inline elements but can have a width and height
        img is inline block element -->

        <div> always start at new line </div> <!-- we can apply display inline block in <div></div> and it will not start at new line-->
        <div>block element</div>
        <span>inline element</span>
